[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-config-bench"
version = "1.0.0"
description = "A graphical proxy discovery, connectivity testing, speed benchmarking, and configuration ranking tool for V2Ray/Xray."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Farzad", email = "developer@example.com"}
]
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "PySocks>=1.7.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]

[project.scripts]
xray-config-bench = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
