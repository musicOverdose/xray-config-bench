name: CI & Cross-Platform Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libegl1-mesa

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run automated test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v

  build-windows:
    name: Build Standalone Windows Executable
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller xray-config-bench.spec

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          if (Test-Path dist\xray-config-bench.exe) {
              Compress-Archive -Path dist\xray-config-bench.exe -DestinationPath xray-config-bench-windows-x64.zip
          } elseif (Test-Path dist\xray-config-bench) {
              Compress-Archive -Path dist\xray-config-bench\* -DestinationPath xray-config-bench-windows-x64.zip
          } else {
              throw "PyInstaller output not found in dist/"
          }

      - name: Upload Windows Standalone Package
        uses: actions/upload-artifact@v4
        with:
          name: xray-config-bench-windows-x64
          path: xray-config-bench-windows-x64.zip
          retention-days: 14
